<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>小万 - XiaoWan Agent</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: system-ui, sans-serif;
        }
        body {
            background: #121218;
            color: #fff;
            padding: 24px;
            max-width: 900px;
            margin: 0 auto;
        }
        .header {
            margin-bottom:20px;
        }
        .config-row {
            display:flex;
            gap:12px;
            margin-bottom:16px;
            flex-wrap:wrap;
        }
        select,input {
            padding:10px 12px;
            border-radius:8px;
            border:1px solid #333;
            background:#1e1e28;
            color:#fff;
            outline:none;
        }
        textarea {
            width:100%;
            min-height:120px;
            padding:14px;
            background:#1e1e28;
            border:1px solid #333;
            color:#fff;
            border-radius:10px;
            resize:vertical;
            margin-bottom:12px;
        }
        button {
            padding:11px 22px;
            border:none;
            border-radius:8px;
            background:#4060ff;
            color:white;
            font-weight:bold;
            cursor:pointer;
        }
        #result {
            margin-top:20px;
            white-space:pre-wrap;
            padding:16px;
            background:#1a1a24;
            border-radius:10px;
            min-height:80px;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>小万 XiaoWan Agent</h1>
        <p>DeepSeek API | 模型切换 + 代码创作模式</p>
    </div>

    <div class="config-row">
        <select id="modelSelect">
            {% for m in models %}
            <option value="{{m.name}}">{{m.display}}</option>
            {% endfor %}
        </select>
        <input type="text" id="apiKey" placeholder="粘贴DeepSeek API Key">
    </div>

    <textarea id="promptInput" placeholder="在这里输入你的问题，写代码、创作任务都可以..."></textarea>
    <button onclick="sendChat()">发送请求</button>

    <div id="result"></div>

    <script>
        async function sendChat(){
            const apiKey = document.getElementById("apiKey").value;
            const model = document.getElementById("modelSelect").value;
            const prompt = document.getElementById("promptInput").value;
            const resBox = document.getElementById("result");
            resBox.innerText = "正在请求...";
            try{
                const resp = await fetch("/api/chat",{
                    method:"POST",
                    headers:{"Content-Type":"application/json"},
                    body:JSON.stringify({api_key:apiKey, model:model, prompt:prompt})
                })
                const data = await resp.json();
                if(data.choices && data.choices[0]){
                    resBox.innerText = data.choices[0].message.content;
                }else{
                    resBox.innerText = JSON.stringify(data,null,2);
                }
            }catch(err){
                resBox.innerText = "请求出错："+err;
            }
        }
    </script>
</body>
</html>
